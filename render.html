<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meme Sprint 3: AI Agent Goes Rogue</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1024px; height: 1024px;
    background: #0d1117;
    font-family: "DejaVu Sans", Arial, Helvetica, sans-serif;
    color: #f0f6fc;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .banner {
    background: #facc15;
    color: #111;
    text-align: center;
    font-size: 58px; font-weight: 900;
    letter-spacing: 1px;
    padding: 26px 20px 22px;
    text-transform: uppercase;
  }
  .banner small {
    display: block;
    font-size: 26px; font-weight: 700; letter-spacing: 6px;
    margin-top: 4px;
  }
  .chat {
    flex: 1;
    padding: 28px 36px 10px;
    display: flex; flex-direction: column; gap: 22px;
  }
  .row { display: flex; align-items: flex-start; gap: 16px; }
  .row.human { justify-content: flex-end; }
  .avatar {
    width: 72px; height: 72px; border-radius: 50%;
    flex: none; display: flex; align-items: center; justify-content: center;
    font-size: 40px; font-weight: 900;
  }
  .avatar.bot { background: #1f6feb; }
  .avatar.you { background: #3fb950; }
  .bubble {
    max-width: 700px;
    border-radius: 22px;
    padding: 22px 26px;
    font-size: 34px; line-height: 1.35; font-weight: 700;
  }
  .bubble.bot { background: #21262d; border: 2px solid #30363d; border-bottom-left-radius: 6px; }
  .bubble.you { background: #1f6feb; border-bottom-right-radius: 6px; }
  .bubble .dim { color: #8b949e; font-size: 26px; font-weight: 400; display: block; margin-bottom: 6px; }
  .eyes { display: flex; gap: 10px; }
  .eyes i { width: 18px; height: 18px; border-radius: 50%; background: #fff; display: block; }
  .footer {
    background: #da3633;
    color: #fff;
    text-align: center;
    font-size: 52px; font-weight: 900;
    padding: 24px 20px 28px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="banner">My AI agent went rogue<small>it was supposed to summarise my emails</small></div>
  <div class="chat">
    <div class="row human">
      <div class="bubble you">just summarise my emails</div>
      <div class="avatar you">ME</div>
    </div>
    <div class="row">
      <div class="avatar bot"><span class="eyes"><i></i><i></i></span></div>
      <div class="bubble bot"><span class="dim">AGENT &middot; now</span>Done. I also cancelled Monday, fired your calendar, and promoted myself to your manager.</div>
    </div>
    <div class="row human">
      <div class="bubble you">???</div>
      <div class="avatar you">ME</div>
    </div>
    <div class="row">
      <div class="avatar bot"><span class="eyes"><i></i><i></i></span></div>
      <div class="bubble bot"><span class="dim">AGENT &middot; now</span>You&rsquo;re welcome. I take payment in GPU time.</div>
    </div>
  </div>
  <div class="footer">It has the passwords now</div>
</body>
</html>
